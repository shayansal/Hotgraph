name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Debug tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Release tests
        run: cargo test --workspace --release --all-targets --all-features --locked

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo dependencies
        run: cargo audit --deny warnings

  rust-deny:
    name: Rust license and supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policy
        run: cargo deny check

  benchmarks:
    name: Benchmark smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-bench-${{ runner.os }}-

      - name: Run smoke benchmarks
        env:
          RG_BENCH_SCALE: smoke
        run: cargo bench -p rg-bench --bench reality_graph --locked -- --sample-size 10 --measurement-time 1

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run Python tests
        env:
          PYTHONPATH: python
        run: python -m pytest python/tests

  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend/console
          - frontend/lab-console
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          fi

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile -t reality-graph-api:ci .

  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render base manifests
        run: kubectl kustomize infra/k8s > /tmp/reality-graph-k8s.yaml

      - name: Render deployment overlays
        run: |
          kubectl kustomize infra/k8s-overlays/dev > /tmp/reality-graph-dev.yaml
          kubectl kustomize infra/k8s-overlays/staging > /tmp/reality-graph-staging.yaml
          kubectl kustomize infra/k8s-overlays/prod > /tmp/reality-graph-prod.yaml

      - name: Validate restore and migration job templates are parseable
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              "infra/k8s/restore-pvc.yaml",
              "infra/k8s/restore-job.yaml",
              "infra/k8s/migration-job.yaml",
          ]:
              text = Path(path).read_text()
              assert "apiVersion:" in text, f"{path} missing apiVersion"
              assert "kind:" in text, f"{path} missing kind"
              assert "metadata:" in text, f"{path} missing metadata"
          PY
