[package]
name = "rg-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.7"
rg-ai = { path = "../rg-ai" }
rg-core = { path = "../rg-core" }
rg-events = { path = "../rg-events" }
rg-governance = { path = "../rg-governance" }
rg-ingest = { path = "../rg-ingest" }
rg-query = { path = "../rg-query" }
rg-storage = { path = "../rg-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = "5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
