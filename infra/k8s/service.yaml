apiVersion: v1
kind: Service
metadata:
  name: reality-graph-api
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reality-graph-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: reality-graph-worker
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reality-graph-worker
  ports:
    - name: health
      port: 8081
      targetPort: health
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: qdrant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: object-storage
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: object-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: object-storage
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
