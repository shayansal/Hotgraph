apiVersion: batch/v1
kind: CronJob
metadata:
  name: reality-graph-api-backup
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-api-backup
    app.kubernetes.io/part-of: reality-graph
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reality-graph-api-backup
            app.kubernetes.io/part-of: reality-graph
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.example.com/reality-graph-api:0.1.0
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/${ts}"
                  mkdir -p "${target}"
                  test -f /data/hotgraph.redb
                  hotgraph backup create --store /data/hotgraph.redb --output "${target}/hotgraph.backup"
                  hotgraph backup verify --input "${target}/hotgraph.backup" > "${target}/VERIFY.txt"
                  sha256sum "${target}"/* > "${target}/SHA256SUMS"
                  find /backup -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +
              volumeMounts:
                - name: api-data
                  mountPath: /data
                - name: api-backups
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: api-data
              persistentVolumeClaim:
                claimName: reality-graph-api-data
            - name: api-backups
              persistentVolumeClaim:
                claimName: reality-graph-api-backups
