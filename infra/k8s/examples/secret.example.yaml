apiVersion: v1
kind: Secret
metadata:
  name: reality-graph-secrets
  namespace: reality-graph
type: Opaque
stringData:
  # Replace this example with a Kubernetes Secret managed by your secret store.
  # Do not commit real API keys, Grafana passwords, or object-storage credentials.
  RG_API_KEYS: "replace-with-long-random-key:api-writer:tenant-default:reader|writer"
  GRAFANA_ADMIN_PASSWORD: "replace-me"
  MINIO_ROOT_USER: "realitygraph"
  MINIO_ROOT_PASSWORD: "replace-me"
