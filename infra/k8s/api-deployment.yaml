apiVersion: apps/v1
kind: Deployment
metadata:
  name: reality-graph-api
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-api
    app.kubernetes.io/part-of: reality-graph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reality-graph-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reality-graph-api
        app.kubernetes.io/part-of: reality-graph
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /v1/metrics
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.com/reality-graph-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: reality-graph-config
          env:
            - name: RG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: reality-graph-secrets
                  key: RG_API_KEYS
                  optional: false
            - name: RG_EVENT_LOG_PATH
              value: /var/lib/reality-graph/events.log
            - name: RG_IDEMPOTENCY_LOG_PATH
              value: /var/lib/reality-graph/idempotency.log
          volumeMounts:
            - name: api-data
              mountPath: /var/lib/reality-graph
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: reality-graph-api-data
