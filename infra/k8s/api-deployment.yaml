apiVersion: apps/v1
kind: Deployment
metadata:
  name: reality-graph-api
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-api
    app.kubernetes.io/part-of: reality-graph
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reality-graph-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reality-graph-api
        app.kubernetes.io/part-of: reality-graph
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /v1/metrics
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: reality-graph-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: reality-graph-config
          env:
            - name: RG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: reality-graph-secrets
                  key: RG_API_KEYS
                  optional: true
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
