apiVersion: batch/v1
kind: Job
metadata:
  name: reality-graph-migration-check
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph-migration-check
    app.kubernetes.io/part-of: reality-graph
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reality-graph-migration-check
        app.kubernetes.io/part-of: reality-graph
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration-check
          image: registry.example.com/reality-graph-api:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              test -f /data/hotgraph.redb
              hotgraph backup create --store /data/hotgraph.redb --output /tmp/pre-migration.hotgraph
              hotgraph backup verify --input /tmp/pre-migration.hotgraph
          volumeMounts:
            - name: api-data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: reality-graph-api-data
        - name: tmp
          emptyDir: {}
