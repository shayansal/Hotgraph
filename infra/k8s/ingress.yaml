apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reality-graph
  namespace: reality-graph
  labels:
    app.kubernetes.io/name: reality-graph
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: reality-graph.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reality-graph-api
                port:
                  name: http
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
